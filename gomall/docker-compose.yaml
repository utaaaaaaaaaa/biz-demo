version: '3'
services:
  consul:
    image: 'hashicorp/consul'
    ports:
      - 8500:8500
  mysql:
    image: "mysql:8.4.3"
    ports:
      - 13306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=demo_proto
  redis:
    image: "redis:5.0.14"
    ports:
      - 16379:6379
  nats:
    image: nats:latest
    ports:
      - "4222:4222"